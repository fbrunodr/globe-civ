<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Town Designs</title>
    <style>
      #topbar label { display: flex; align-items: center; gap: 4px; }
      body:not([data-view="towns"]) .towns-only { display: none !important; }
      body:not([data-view="classes"]) .classes-only { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div id="topbar">
        <span id="civ">Town designs</span>
        <nav class="devnav"><a href="/">Game</a><a href="/gallery.html">Gallery</a><a href="/buildings.html">Buildings</a><a href="/city_lab.html">City lab</a><a class="active" href="/city_designs.html">Town designs</a><a href="/town_editor.html">Town editor</a><a href="/world_view.html">World view</a><a href="/map_editor.html">Map editor</a></nav>
        <button data-view="classes" class="active">Classes</button>
        <button data-view="towns">Sample towns</button>
        <label class="classes-only">Role <select id="role"><option value="block">block</option><option value="center">center</option><option value="walled">walled center</option><option value="wonder-monument">wonder: monument</option><option value="wonder-arena">wonder: arena</option><option value="wonder-hall">wonder: hall</option><option value="wonder-tower">wonder: tower</option></select></label>
        <label class="classes-only">Density <select id="density"><option value="low">low</option><option value="medium" selected>medium</option><option value="dense">dense</option><option value="high">high</option><option value="metropolitan">metropolitan</option></select></label>
        <label class="towns-only">Town <select id="townDensity"><option value="low">low</option><option value="medium" selected>medium</option><option value="dense">dense</option><option value="high">high</option><option value="metropolitan">metropolitan</option><option value="mixed">mixed</option></select></label>
        <button id="reroll" class="towns-only">Another town</button>
        <label>Civ <select id="lookCiv"></select></label>
        <label><input type="checkbox" id="walls" /> walls</label>
        <label><input type="checkbox" id="buildings" checked /> buildings in spots</label>
        <button id="fit">Whole sheet</button>
        <span class="spacer"></span>
        <span id="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>Q</kbd>/<kbd>E</kbd> rotate · <kbd>Z</kbd>/<kbd>X</kbd> zoom</span>
        <span id="info"></span>
      </div>
    </div>
    <script type="module" src="/src/designSheet.ts"></script>
  </body>
</html>
