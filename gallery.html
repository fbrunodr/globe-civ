<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
    <style>
      :root { --bg: rgba(14, 17, 26, 0.88); --border: rgba(255, 255, 255, 0.12); --text: #e8ecf3; --muted: #9aa3b5; --accent: #3d8bfd; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fc3e6; color: var(--text);
        font: 13px/1.4 system-ui, -apple-system, sans-serif; }
      canvas#c { display: block; width: 100vw; height: 100vh; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
        padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--border); z-index: 2; }
      #bar .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
      #bar .spacer { flex: 1; }
      button, select { font: inherit; color: var(--text); background: rgba(255,255,255,0.07); border: 1px solid var(--border);
        border-radius: 7px; padding: 5px 9px; cursor: pointer; }
      select option { background: #1a1f2b; }
      button:hover { background: rgba(255,255,255,0.15); }
      button.active { outline: 2px solid var(--accent); background: rgba(61,139,253,0.2); }
      label { display: flex; align-items: center; gap: 4px; color: var(--muted); }
      #info { color: var(--muted); }
      .devnav { display: flex; gap: 2px; }
      .devnav a { color: var(--muted); text-decoration: none; padding: 3px 9px; border-radius: 6px; }
      .devnav a:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); }
      .devnav a.active { color: var(--text); background: rgba(61, 139, 253, 0.25); }
      .lbl { pointer-events: auto; cursor: pointer; background: rgba(14,17,26,0.78); color: var(--text); padding: 4px 8px;
        border-radius: 7px; text-align: center; white-space: nowrap; border: 1px solid transparent; }
      .lbl.focus { border-color: var(--accent); }
      .lbl b { display: block; font-size: 13px; }
      .lbl small { color: var(--muted); font-size: 11px; }
      .lbl .over { color: #ff8a80; }
      #mix { position: fixed; left: 12px; bottom: 12px; max-width: min(560px, calc(100vw - 24px)); max-height: 45vh; overflow: auto;
        background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; z-index: 2; }
      #mix:empty { display: none; }
      #mix h4 { margin: 0 0 4px; }
      #mix .row { color: var(--muted); }
      #mix .row b { color: var(--text); font-weight: 600; }
      .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 2px; vertical-align: baseline; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div id="bar">
      <nav class="devnav"><a href="/">Game</a><a class="active" href="/gallery.html">Gallery</a><a href="/city_lab.html">City lab</a><a href="/world_view.html">World view</a></nav>
      <span class="sep"></span>
      <button data-view="terrains">Terrains</button>
      <button data-view="catalog">Catalog</button>
      <span class="sep"></span>
      <select id="terrain" title="Terrain (← → to cycle)"></select>
      <label><input type="checkbox" id="jitter" checked /> new jitter</label>
      <label><input type="checkbox" id="groves" checked /> groves</label>
      <button id="reroll" title="New random placement">Reroll</button>
      <span class="sep"></span>
      <button data-cam="map">Map view</button>
      <button data-cam="close">Close</button>
      <button data-cam="ground">Ground (walk eye)</button>
      <span class="spacer"></span>
      <span id="info"></span>
    </div>
    <div id="mix"></div>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
