<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Globe Civ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud" class="hidden">
      <header id="topbar">
        <div id="yields"></div>
        <span class="spacer"></span>
        <div id="turn"></div>
        <div id="civ"></div>
        <nav id="sheets"></nav>
        <button id="menuBtn" data-tip="Menu: settings and controls"></button>
      </header>
      <div id="trackers"></div>
      <div id="notices"></div>
      <div id="sheet" class="hidden"></div>
      <div id="selection" class="panel hidden"></div>
      <div id="cityside" class="panel hidden"></div>
      <div id="corner">
        <button id="next" data-act="next"></button>
        <div id="lenses"></div>
        <div id="minimap"></div>
      </div>
      <div id="tileinfo" class="hidden"></div>
      <div id="fps" class="hidden">– fps</div>
    </div>
    <div id="tip" class="hidden"></div>
    <div id="menu" class="hidden"></div>
    <div id="start"></div>
    <div id="overlay" class="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
